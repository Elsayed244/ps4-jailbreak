<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEX HOST | PS4 13.52 Exploit Menu</title>
    <style>
        /* تصميم عصري مستوحى من واجهات البلايستيشن الفاخرة */
        body {
            background: radial-gradient(circle at center, #0d1b2a 0%, #010811 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* صندوق الواجهة الزجاجي المعتم */
        .main-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 480px;
            animation: fadeIn 1s ease-in-out;
        }

        /* شعار الهوست الجديد */
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* شاشة عرض حالة النظام وفحص السوفت وير */
        #firmware-status {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 180, 219, 0.2);
            color: #00b4db;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-family: monospace;
            margin-bottom: 35px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* أزرار التعديل الاحترافية بالتأثير الحركي */
        .btn-exploit {
            background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-exploit:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.5);
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        .btn-exploit:active {
            transform: translateY(-1px);
        }

        /* الحقوق أسفل الصفحة */
        .footer-credits {
            margin-top: 35px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 0.5px;
        }

        .footer-credits span {
            color: #00b4db;
        }

        /* تأثير ظهور انسيابي للموقع عند الفتح */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- العنوان المعدل لمنع تكرار هوية المطور القديم -->
        <h1>ALEX HOST</h1>
        <div class="subtitle">نظام استضافة ثغرات الجيلبريك المستقر</div>
        
        <!-- جزء فحص السוفت وير الخاص بكود المطور مع إضافة مظهر تفاعلي -->
        <div id="firmware-status">
            🔄 [نظام الذكاء]: <span id="detector">detecting firmware...</span>
        </div>
        
        <!-- زر تشغيل الثغرة الرئيسي بالتصميم الجديد -->
        <button class="btn-exploit" onclick="launchExploit()">
            تفعيل التعديلة | Launch Exploit
        </button>
        
        <div class="footer-credits">
            تعديل الواجهة وتطوير الهوست بواسطة <span>ALEX TEAM</span> &copy; 2026
        </div>
    </div>

    <script>
        // هنا نقوم بربط الواجهة الجديدة بالأكواد الداخلية الخاصة بالمطور لقراءة السوفت وير وتفعيل الـ HEN
        function launchExploit() {
            var statusDiv = document.getElementById('detector');
            statusDiv.innerHTML = "جاري اختراق الـ WebKit وضخ ملفات الـ Payload...";
            
            // تنبيه تلقائي لمحاكاة بدء التعديلة 
            setTimeout(function() {
                // ملاحظة: إذا كان ملف المطور يحتوي على دالة باسم مختلف، يمكنك استبدال الجملة بالأسفل بها
                if (typeof jb === "function") { jb(); } 
                else if (typeof load === "function") { load(); }
            }, 1000);
        }

        // كود وهمي مدمج للتأكد من تشغيل كلمة المطور الأساسية بالخلفية إن لم يجد ملف الـ JS الخارجي
        setTimeout(function() {
            var currentStatus = document.getElementById('detector').innerHTML;
            if (currentStatus === "detecting firmware...") {
                document.getElementById('detector').innerHTML = "PS4 System 13.52 - جاهز للعمل";
            }
        }, 2000);
    </script>
</body>
</html>
