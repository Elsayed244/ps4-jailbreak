<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ps4 jailbreak | Exploit Menu</title>
    <style>
        /* تصميم الواجهة الانسيابية الهادئة والمريحة جداً للعين */
        body {
            background: linear-gradient(125deg, #020904, #051409, #02050e, #010402);
            background-size: 400% 400%;
            animation: fluidGradient 15s ease infinite;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* صندوق الواجهة الزجاجي المعتم المعزول */
        .main-container {
            background: rgba(1, 5, 2, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(57, 255, 20, 0.08);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            width: 90%;
            max-width: 480px;
            animation: fadeIn 1.2s ease-in-out;
        }
        
        h1 {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, #39ff14 0%, #0d5c1d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #8cb991;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* منطقة عرض الرموز الحركية */
        .status-visual-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            height: 90px;
        }

        /* تصميم القفل وجعله ينبض بهدوء */
        .lock-icon {
            width: 60px;
            height: 60px;
            fill: fill;
            fill-opacity: 0;
            stroke: #26e600;
            stroke-width: 2;
            transition: all 0.5s ease;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* تصميم شعار الـ GoldHEN والظهور الخفي */
        .goldhen-logo {
            display: none;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* شاشة عرض الحالات باللون الأخضر المريح */
        #firmware-status {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(13, 92, 29, 0.4);
            color: #26e600;
            padding: 18px;
            border-radius: 16px;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 35px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            min-height: 50px;
            white-space: pre-line;
            text-align: right;
            direction: ltr;
            line-height: 1.6;
        }

        /* زر تشغيل الثغرة الاحترافي */
        .btn-exploit {
            background: linear-gradient(135deg, #093a13 0%, #011405 100%);
            color: #4fff30;
            border: 1px solid rgba(79, 255, 48, 0.3);
            padding: 16px 32px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-exploit:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
            background: linear-gradient(135deg, #26e600 0%, #093a13 100%);
            color: #000000;
            border-color: #26e600;
        }

        /* الحقوق أسفل الصفحة */
        .footer-credits {
            margin-top: 40px;
            font-size: 11px;
            color: #4b5e4d;
            letter-spacing: 0.5px;
        }

        .footer-credits span {
            color: #26e600;
        }

        /* الحركات والأنيميشن */
        @keyframes fluidGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(57,255,20,0.2)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(57,255,20,0.5)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(57,255,20,0.2)); }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <div class="status-visual-box">

    <script type="module" src="jb.js"></script>

    <script>

            var lockSvg = document.getElementById('lock-svg');
            var goldhenText = document.getElementById('goldhen-text');
            
            if (consoleLog) {
                consoleLog.innerHTML = "[!] INIT: WebKit Exploit Armed...\n[#] RUNNING: Memory Primitive Leak...";

</html>
