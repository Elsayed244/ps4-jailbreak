<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <style>
        body {
            background: linear-gradient(125deg, #020904, #051409, #02050e, #010402);
            background-size: 400% 400%;
            animation: fluidGradient 15s ease infinite;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            background: rgba(1, 5, 2, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(57, 255, 20, 0.08);
            padding: 35px 25px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #8cb991;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status-visual-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            height: 90px;
            position: relative;
        }

        .lock-icon {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: #26e600;
            stroke-width: 2;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .lock-icon.unlocked path {
            transform: translateY(-4px) rotate(-15deg);
            transform-origin: 17px 7px;
            transition: transform 0.5s ease;
        }

        .lock-icon.failed {
            stroke: #ff2a2a !important;
            animation: failShake 0.5s ease, pulseRed 1.5s infinite ease-in-out !important;
        }

        .goldhen-logo {

            font-family: 'Impact', 'Arial Black', sans-serif;

            font-weight: bold;
            letter-spacing: 2px;

            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
        }

        .goldhen-logo.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .progress-container {

            height: 8px;
            border-radius: 10px;
            margin-bottom: 20px;

            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #26e600, #39ff14);
            box-shadow: 0 0 10px #26e600;
            transition: width 0.3s ease;
        }

        #out {

            padding: 15px;
            border-radius: 16px;

            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 25px;

            height: 110px;
            overflow-y: auto;
            white-space: pre-wrap;
            text-align: left;
            direction: ltr;
            line-height: 1.5;
        }

        .ok { color: #39ff14; font-weight: bold; }
        .warn { color: #ffd700; }
        .bad { color: #ff3b3b; font-weight: bold; }

        .btn-exploit {

            color: #4fff30;

            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-exploit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
            background: linear-gradient(135deg, #26e600 0%, #093a13 100%);
            color: #000000;
            border-color: #26e600;
        }

        .btn-exploit:disabled {
            background: #111;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        .footer-credits {
            margin-top: 25px;
            font-size: 11px;
            color: #4b5e4d;
        }

        .footer-credits span {
            color: #26e600;
        }

        /* تصميم الإشعار الجانبي (Side Notification) */
        .side-toast {
            position: fixed;
            top: 25px;
            right: -350px;
            background: rgba(25, 4, 4, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #ff2a2a;
            border-left: 5px solid #ff2a2a;
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(255, 42, 42, 0.35);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: left;
            direction: ltr;
            z-index: 9999;
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 280px;
        }

        .side-toast.show {
            right: 25px;
        }

        .side-toast-title {
            color: #ff3b3b;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .side-toast-msg {
            color: #e0e0e0;
            font-size: 12px;
            line-height: 1.4;
        }

        @keyframes fluidGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(57,255,20,0.2)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(57,255,20,0.5)); }
        }

        @keyframes pulseRed {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(255,42,42,0.4)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 15px rgba(255,42,42,0.8)); }
        }

        @keyframes failShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
