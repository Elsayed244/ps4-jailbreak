<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 Jailbreak | Host Menu</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: linear-gradient(125deg, #020904, #051409, #02050e, #010402);
        background-size: 400% 400%;
        animation: fluidGradient 15s ease infinite;
        color: #c8ced8;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }

      @keyframes fluidGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* الشريط العلوي */
      #brand {
        text-align: center;
        padding: 14px 10px;
        background: rgba(1, 5, 2, 0.7);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(57, 255, 20, 0.15);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }

      #brand b {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.14em;
        background: linear-gradient(135deg, #39ff14 0%, #0d5c1d 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        vertical-align: middle;
        text-transform: uppercase;
      }

      /* حاوية زر التشغيل في المنتصف */
      #start-box {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(1, 5, 2, 0.55);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(57, 255, 20, 0.15);
        padding: 35px 25px;
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
        width: 85%;
        max-width: 400px;
        text-align: center;
        z-index: 10;
      }

      #start-box h2 {
        margin: 0 0 8px;
        font-size: 24px;
        color: #39ff14;
        letter-spacing: 1px;
      }

      #start-box p {
        margin: 0 0 22px;
        font-size: 13px;
        color: #8cb991;
      }

      .btn-exploit {
        background: linear-gradient(135deg, #093a13 0%, #011405 100%);
        color: #4fff30;
        border: 1px solid rgba(79, 255, 48, 0.35);
        padding: 16px 28px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 14px;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-exploit:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(57, 255, 20, 0.35);
        background: linear-gradient(135deg, #26e600 0%, #093a13 100%);
        color: #000000;
        border-color: #26e600;
      }

      /* شريط حالة الكاش أوفلاين */
      #cache-status {
        margin-top: 15px;
        font-size: 12px;
        color: #ffd700;
        min-height: 18px;
      }

      /* دائرة التحميل (مخفية حتى الضغط على الزر) */
      #spin {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        width: 54px;
        height: 54px;
        margin: -27px 0 0 -27px;
        border: 4px solid rgba(38, 230, 0, 0.15);
        border-top-color: #39ff14;
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* رسالة النتيجة في المنتصف */
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 20px;
        letter-spacing: 1px;
        display: none;
        padding: 0 20px;
      }

      #wrap {
        padding: 0;
      }

      #state,
      #out {
        display: none;
      }

      /* حالات التشغيل التي يتحكم بها ملف jb.js */
      body.running #spin {
        display: block;
      }

      body.done #spin,
      body.fail #spin {
        display: none !important;
      }

      body.fail #msg {
        display: block;
        color: #ff3b3b;
        font-weight: 700;
        text-shadow: 0 0 15px rgba(255, 59, 59, 0.4);
      }

      body.done #msg {
        display: block;
        color: #39ff14;
        font-weight: 800;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
      }

      /* وضع عرض السجلات الكاملة عند إضافة ?log=1 للرابط */
      body.log #start-box,
      body.log #spin,
      body.log #msg {
        display: none !important;
      }

      body.log #wrap {
        padding: 18px 22px;
        max-width: 800px;
        margin: 0 auto;
      }

      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 700;
        color: #39ff14;
        margin: 0 0 12px;
        text-align: left;
        direction: ltr;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.5 Consolas, "Courier New", monospace;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(57, 255, 20, 0.25);
        border-radius: 12px;
        padding: 14px 16px;
        height: calc(100vh - 155px);
        overflow-y: auto;
        text-align: left;
        direction: ltr;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
      }

      .ok, .safe { color: #39ff14; font-weight: bold; }
      .bad, .danger { color: #ff3b3b; font-weight: bold; }
      .warn { color: #ffd700; }
      code { color: #8cb991; }

      /* حقوق المطور */
      .footer-credits {
        position: fixed;
        bottom: 15px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #4b5e4d;
      }
      .footer-credits span {
        color: #26e600;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>PS4 JAILBREAK | 13.52</b>
    </div>

    <!-- صندوق زر التشغيل -->
    <div id="start-box">
      <h2>PS4 HOST MENU</h2>
      <p>نظام استضافة ثغرات الجيلبريك المستقر</p>
      <button id="launch-btn" class="btn-exploit">
        INITIALIZE EXPLOIT | Launch HEN
      </button>
      <div id="cache-status"></div>
    </div>

    <!-- عناصر الحالة والسجلات الخاصة بملف jb.js -->
    <div id="spin"></div>
    <div id="msg"></div>

    <div id="wrap">
      <h2 id="state"></h2>
      <div id="out"></div>
    </div>

    <div class="footer-credits">
      تطوير وتعديل الواجهة بواسطة <span>المطور السيد جبارة</span> &copy; 2026
    </div>

    <script>
      // 1. دالة بدء التشغيل عند الضغط على الزر
      function startExploit() {
        document.getElementById('start-box').style.display = 'none';
        document.body.classList.add('running');

        const script = document.createElement('script');
        script.type = 'module';
        script.src = './jb.js';
        document.body.appendChild(script);
      }

      document.getElementById('launch-btn').addEventListener('click', startExploit);

      // إذا تم فتح الرابط بوضع السجلات (?log=1) يتم التشغيل مباشرة لإظهار السجل
      if (window.location.search.includes('log=1')) {
        startExploit();
      }

      // 2. مراقبة حالة حفظ الموقع للعمل بدون إنترنت (Offline Cache)
      if (window.applicationCache) {
        const cacheStatus = document.getElementById('cache-status');

        window.applicationCache.addEventListener('downloading', function() {
          cacheStatus.textContent = 'جاري حفظ الملفات للعمل أوفلاين... 0%';
        });

        window.applicationCache.addEventListener('progress', function(e) {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            cacheStatus.style.color = '#ffd700';
            cacheStatus.textContent = `جاري تثبيت الكاش أوفلاين... ${percent}%`;
          }
        });

        window.applicationCache.addEventListener('cached', function() {
          cacheStatus.style.color = '#39ff14';
          cacheStatus.textContent = '✔ تم حفظ الموقع بنجاح! يمكنك الآن فصل الإنترنت.';
        });

        window.applicationCache.addEventListener('updateready', function() {
          cacheStatus.style.color = '#39ff14';
          cacheStatus.textContent = '✔ تم تحديث ملفات الكاش! أعد تحميل الصفحة.';
        });

        window.applicationCache.addEventListener('noupdate', function() {
          cacheStatus.style.color = '#8cb991';
          cacheStatus.textContent = '✔ الموقع جاهز للعمل بدون إنترنت (Offline Ready)';
        });
      }
    </script>
  </body>
</html>
